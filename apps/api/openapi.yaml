openapi: 3.0.0
info:
  title: Mating Marketplace API
  description: |
    Canonical OpenAPI contract. Full schema is generated from NestJS Swagger decorators
    via `pnpm --filter @mating/api openapi:export` (see `openapi.json`).
    M2 animal supply routes are tagged `animals`, `animal-health`, `pedigree`, `verification`.
    M3 discovery routes are tagged `marketplace`, `matching`, `saved-listings`.
  version: 0.0.1
paths:
  /api/v1/animals:
    get:
      tags: [animals]
      summary: List own animals
    post:
      tags: [animals]
      summary: Create draft animal
  /api/v1/animals/{id}:
    get:
      tags: [animals]
      summary: Get owned animal
    patch:
      tags: [animals]
      summary: Update draft animal
    delete:
      tags: [animals]
      summary: Soft-delete animal
  /api/v1/animals/{id}/publish-ready:
    post:
      tags: [animals]
      summary: Mark publish-ready after eligibility
  /api/v1/animals/{id}/media/upload-url:
    post:
      tags: [animals]
      summary: Mint signed upload URL
  /api/v1/animals/{id}/media:
    get:
      tags: [animals]
      summary: List media with signed read URLs
  /api/v1/animals/{id}/verification:
    get:
      tags: [verification]
      summary: Per-dimension verification status
  /api/v1/animals/{id}/health-records:
    get:
      tags: [animal-health]
      summary: List health records
    post:
      tags: [animal-health]
      summary: Add clinical health record
  /api/v1/animals/{id}/health-records/{recordId}/read-url:
    post:
      tags: [animal-health]
      summary: Signed read URL for health document
  /api/v1/animals/{id}/pedigree:
    get:
      tags: [pedigree]
      summary: List pedigree records
    post:
      tags: [pedigree]
      summary: Add pedigree entry
  /api/v1/listings:
    get:
      tags: [matching]
      summary: Search active listings
    post:
      tags: [marketplace]
      summary: Create draft listing
  /api/v1/listings/mine:
    get:
      tags: [marketplace]
      summary: List own listings
  /api/v1/listings/{id}:
    get:
      tags: [marketplace]
      summary: Public listing detail
    patch:
      tags: [marketplace]
      summary: Update own listing
  /api/v1/listings/{id}/publish:
    post:
      tags: [marketplace]
      summary: Publish listing
  /api/v1/listings/{id}/pause:
    post:
      tags: [marketplace]
      summary: Pause listing
  /api/v1/listings/{id}/unpublish:
    post:
      tags: [marketplace]
      summary: Unpublish listing
  /api/v1/saved-listings:
    get:
      tags: [saved-listings]
      summary: List saved listings
    post:
      tags: [saved-listings]
      summary: Save listing
  /api/v1/saved-listings/{listingId}:
    delete:
      tags: [saved-listings]
      summary: Unsave listing
  /api/v1/admin/verifications:
    get:
      tags: [admin]
      summary: Admin verification queue
  /api/v1/admin/verifications/{id}/approve:
    post:
      tags: [admin]
      summary: Approve verification dimension
  /api/v1/admin/verifications/{id}/reject:
    post:
      tags: [admin]
      summary: Reject verification dimension
  /api/v1/admin/disputes:
    get:
      tags: [admin]
      summary: List disputes for support queue
  /api/v1/admin/disputes/{id}/resolve:
    post:
      tags: [admin]
      summary: Resolve dispute with optional refund
  /api/v1/reviews:
    get:
      tags: [reviews]
      summary: List published reviews
    post:
      tags: [reviews]
      summary: Submit post-completion review
  /api/v1/users/{id}/reputation:
    get:
      tags: [reviews]
      summary: Reputation summary
  /api/v1/admin/reviews/{id}/moderate:
    post:
      tags: [admin]
      summary: Moderate review
  /api/v1/admin/listings/{id}/suspend:
    post:
      tags: [admin]
      summary: Suspend listing
  /api/v1/admin/audit-logs:
    get:
      tags: [admin]
      summary: Search audit logs
  /api/v1/admin/dashboards/summary:
    get:
      tags: [admin]
      summary: Business operations dashboard
